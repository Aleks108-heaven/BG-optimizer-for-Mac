# Builds BG Optimizer on a GitHub-hosted Apple Silicon Mac, runs every automated check and a start-up test of the
# finished app, and keeps the installer (.dmg) with a checksum file. Push a tag like v1.0.0 to also publish a Release.
name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package (Apple Silicon)
    # arm64 runner. It runs a different macOS than the Mac the app was written on, which is itself a useful test.
    runs-on: macos-14
    timeout-minutes: 30
    # id-token and attestations are used only by the provenance step, which runs for version tags. On pull requests
    # from forks GitHub gives the job a read-only token anyway.
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: BGOptimizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Machine and toolchain
        run: |
          sw_vers
          uname -m
          swift --version
          xcode-select -p

      - name: Build the app and the installer
        run: ./build.sh --dmg

      - name: Automated checks and start-up test of the finished app
        # tests/run.sh also limits every section itself and copies each result into an annotation on the run page
        timeout-minutes: 25
        run: ./tests/run.sh

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 BG-Optimizer-*-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign the build record (provenance) for the installer
        # A signed statement from GitHub that this exact .dmg was built from this repository and tag by this workflow.
        # The checksum file only proves the download is not corrupted; this proves where the file came from.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: BGOptimizer/dist/BG-Optimizer-*-arm64.dmg

      - name: Keep the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bg-optimizer-macos-arm64
          path: |
            BGOptimizer/dist/*.dmg
            BGOptimizer/dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish a GitHub Release (version tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bg-optimizer-macos-arm64
          path: dist
      - name: Create the release with the installer attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "BG Optimizer ${GITHUB_REF_NAME#v}" \
            --generate-notes
